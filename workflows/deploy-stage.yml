name: Deploy Stage

on:
  push:
    branches:
      - develop
      - main

  workflow_dispatch:

concurrency:
  group: college-stage-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Stage
    runs-on: ubuntu-latest

    environment:
      name: stage

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGE_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          STAGE_HOST: ${{ secrets.STAGE_HOST }}
          STAGE_USER: ${{ secrets.STAGE_USER }}
          STAGE_PORT: ${{ secrets.STAGE_PORT }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$STAGE_PORT" \
            "$STAGE_USER@$STAGE_HOST"